<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | LazyMatrix</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="LazyMatrix" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        color: #3c3c43;
        background: #fff;
      }
      main {
        max-width: 40rem;
        margin: 15vh auto;
        padding: 1.5rem;
        line-height: 1.7;
      }
      a {
        color: #38634f;
        text-underline-offset: 0.2em;
      }
      .site-title {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .site-title img {
        object-fit: contain;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #dfdfe5;
          background: #1b1b1f;
        }
        a {
          color: #9ac8ac;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/" class="site-title">
        <picture>
          <source
            media="(prefers-color-scheme: dark)"
            srcset="/logo-sunchair-dark.png"
          />
          <img src="/logo-sunchair.png" width="32" height="32" alt="" />
        </picture>
        LazyMatrix

      <h1>Page not found</h1>
      <p>
        This page may have moved. Return to the <a href="/">home page</a>, read
        the <a href="/guide/getting-started">guide</a>, or browse the
