[package]
name = "column-reduction-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
lazymatrix = { path = "../..", default-features = false, features = ["ndarray_v0_17"] }
published = { package = "lazymatrix", version = "=0.9.0", default-features = false, features = ["ndarray_v0_17"] }
ndarray = { version = "=0.17.2", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"
