version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      website:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # New backend release lines require explicit features and compatibility tests.
      - dependency-name: "faer"
      - dependency-name: "faer-traits"
      - dependency-name: "nalgebra"
      - dependency-name: "nalgebra-sparse"
      - dependency-name: "ndarray"
