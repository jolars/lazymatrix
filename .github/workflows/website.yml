name: Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "diplodocus.yaml"
      - "README.md"
      - "scripts/python-tool.py"
      - "benches/normalization_allocations/eager_results.csv"
      - "benches/normalization_tradeoffs/**"
      - "benches/least_squares/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "diplodocus.yaml"
      - "README.md"
      - "scripts/python-tool.py"
      - "benches/normalization_allocations/eager_results.csv"
      - "benches/normalization_tradeoffs/**"
      - "benches/least_squares/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            python/rust
      - name: Prepare Python checkout
        working-directory: .
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.devenv/python
        run: |
          uv sync --project python --locked --no-install-project
          torch_version=$(python -c 'import tomllib; from pathlib import Path; lock = tomllib.loads(Path("python/uv.lock").read_text()); print(next(item["version"] for item in lock["package"] if item["name"] == "torch"))')
          uv pip install --python .devenv/python/bin/python --torch-backend=cpu "torch==$torch_version"
          cd python
          python ../scripts/python-tool.py maturin develop --release --locked
      - name: Prepare Rust documentation toolchain
        working-directory: .
        run: |
          rustup toolchain install nightly-2026-09-28 --profile minimal --no-self-update
          echo "DIPLODOCUS_RUST_TOOLCHAIN=$(rustup run nightly-2026-09-28 rustc --print sysroot)" >> "$GITHUB_ENV"
      - uses: jolars/setup-diplodocus@v1
        with:
          version: "0.9.0"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm deploy:check
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: docs/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-workers
      url: https://lazymatrix.org
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: docs/.vitepress/dist
      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
