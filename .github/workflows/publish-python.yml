name: Publish Python

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.15.0"
          rust-toolchain: "1.89.0"
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --strip
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.15.0"
          rust-toolchain: "1.89.0"
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  test-wheel:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: python-${{ matrix.target }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install and test the built wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest
          python -m pytest python/tests

  publish:
    needs: [wheels, sdist, test-wheel]
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/lazymatrix
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Check release tag matches package metadata
        run: |
          python -c 'import os, tomllib; from pathlib import Path; version = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == f"python-v{version}"'
      - uses: pypa/gh-action-pypi-publish@release/v1
