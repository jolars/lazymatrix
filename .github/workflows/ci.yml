name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.devenv/python

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rustfmt
        run: rustup component add rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tests/feature_unification/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path tests/core_consumer/Cargo.toml --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clippy
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path tests/feature_unification/Cargo.toml --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path tests/core_consumer/Cargo.toml --all-targets --locked -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --no-deps --all-features --locked

  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            args: core
          - group: version-coexistence
            args: coexistence
          - group: faer-0.22
            args: version faer_v0_22
          - group: faer-0.23
            args: version faer_v0_23
          - group: faer-0.24
            args: version faer_v0_24
          - group: nalgebra-0.32
            args: version nalgebra_v0_32
          - group: nalgebra-0.33
            args: version nalgebra_v0_33
          - group: nalgebra-0.34
            args: version nalgebra_v0_34
          - group: nalgebra-0.35
            args: version nalgebra_v0_35
          - group: ndarray-0.15
            args: version ndarray_v0_15
          - group: ndarray-0.16
            args: version ndarray_v0_16
          - group: ndarray-0.17
            args: version ndarray_v0_17
          - group: sprs-0.11
            args: version sprs_v0_11
          - group: zarrs-0.22
            args: version zarrs_v0_22
          - group: zarrs-0.23
            args: version zarrs_v0_23
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.group }}
      - run: bash scripts/test-backends.sh ${{ matrix.args }}
      - name: Run out-of-core examples
        if: matrix.group == 'core'
        run: |
          cargo run --locked --example ndarray_mmap --features ndarray
          cargo run --locked --example zarrs_chunked --features zarrs

  core-msrv:
    strategy:
      matrix:
        include:
          - rust: "1.84.0"
            features: ""
          - rust: "1.85.0"
            features: "sprs_v0_11"
    name: Core and sprs MSRV (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --no-self-update
      - name: Select sprs compatible with Rust 1.85
        if: matrix.features == 'sprs_v0_11'
        run: cargo +${{ matrix.rust }} update --package sprs --precise 0.11.4
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-msrv-${{ matrix.rust }}
      - run: cargo +${{ matrix.rust }} build --locked --no-default-features --features "${{ matrix.features }}"
      - run: cargo +${{ matrix.rust }} test --manifest-path tests/core_consumer/Cargo.toml --locked

  core-wasm:
    name: Core consumer (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/core_consumer
      - run: cargo +stable install wasm-pack --version 0.15.0 --locked
      - run: cargo build --locked --no-default-features --target wasm32-unknown-unknown
      - run: wasm-pack test --node -- --locked
        working-directory: tests/core_consumer

  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.87.0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.87.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: bash scripts/test-backends.sh msrv

  zarrs-msrv:
    name: zarrs 0.23 MSRV (Rust 1.91)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.91.0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.91.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: zarrs-msrv
      - run: bash scripts/test-backends.sh zarrs-msrv

  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust tools
        run: rustup component add rustfmt clippy
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python/rust
      - run: uv sync --project python --locked --no-install-project
      - run: python ../scripts/python-tool.py maturin develop --release --locked
        working-directory: python
      - run: cargo fmt --manifest-path python/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path python/rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: python scripts/python-tool.py ruff check --config python/pyproject.toml python scripts/python-tool.py scripts/check-python-dist.py
      - run: python scripts/python-tool.py ruff format --check --config python/pyproject.toml python scripts/python-tool.py scripts/check-python-dist.py
      - run: python scripts/python-tool.py python -m pytest python/tests
      - name: Test minimum NumPy and SciPy versions
        if: matrix.python == '3.11'
        run: |
          uv pip install --python .devenv/python/bin/python numpy==1.26.4 scipy==1.12.0
          python scripts/python-tool.py python -m pytest python/tests

  python-package:
    name: Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python/rust
      - run: uv sync --project python --locked --no-install-project
      - run: python ../scripts/python-tool.py maturin build --release --locked --out dist
        working-directory: python
      - run: python ../scripts/python-tool.py maturin sdist --out dist
        working-directory: python
      - run: python scripts/python-tool.py python scripts/check-python-dist.py

  release-config:
    name: Release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx --yes versionary@1.6.1 verify
      - run: npx --yes --package versionary@1.6.1 node scripts/check-releases.mjs

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        fmt,
        clippy,
        docs,
        test,
        core-msrv,
        core-wasm,
        msrv,
        zarrs-msrv,
        python,
        python-package,
        release-config,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          versionary-version: "1.6.1"
