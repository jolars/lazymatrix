version: "3"

env:
  UV_PROJECT_ENVIRONMENT: "{{.ROOT_DIR}}/.devenv/python"

# Top-level recipes for lazymatrix maintainer workflows.
# Run `task --list` to see available recipes.

tasks:
  ci:
    desc: Run the local equivalent of the GitHub CI checks.
    cmds:
      - task: fmt
      - task: lint
      - task: docs
      - task: python:check
      - task: python:package
      - task: release:check
      - task: website:check
      - task: test

  fmt:
    desc: Check Rust formatting.
    cmds:
      - cargo fmt --all -- --check
      - cargo fmt --manifest-path tests/feature_unification/Cargo.toml --all -- --check
      - cargo fmt --manifest-path tests/core_consumer/Cargo.toml --all -- --check

  lint:
    desc: Lint all Rust targets and features.
    cmds:
      - cargo clippy --all-features --all-targets --locked -- -D warnings
      - cargo clippy --manifest-path tests/feature_unification/Cargo.toml --workspace --all-features --all-targets --locked -- -D warnings
      - cargo clippy --manifest-path tests/core_consumer/Cargo.toml --all-targets --locked -- -D warnings

  docs:
    desc: Build documentation with warnings denied.
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --no-deps --all-features --locked

  test:
    desc: Test every backend version, parallelism, and feature unification.
    cmds:
      - bash scripts/test-backends.sh

  test-wasm:
    desc: Test the dependency-light core in Node.js.
    cmds:
      - cargo build --locked --no-default-features --target wasm32-unknown-unknown
      - cmd: wasm-pack test --node -- --locked
        dir: tests/core_consumer

  python:install:
    desc: Install the locked Python build and test dependencies.
    cmds:
      - uv sync --project python --locked --no-install-project --inexact

  python:build:
    desc: Rebuild and install the editable Python extension.
    deps: [python:install]
    dir: python
    cmds:
      - python ../scripts/python-tool.py maturin develop --release --locked

  python:check:
    desc: Build, lint, and test the Python bindings.
    cmds:
      - task: python:build
      - cargo fmt --manifest-path python/rust/Cargo.toml -- --check
      - cargo clippy --manifest-path python/rust/Cargo.toml --all-targets --locked -- -D warnings
      - python scripts/python-tool.py ruff check --config python/pyproject.toml python scripts/python-tool.py scripts/check-python-dist.py
      - python scripts/python-tool.py ruff format --check --config python/pyproject.toml python scripts/python-tool.py scripts/check-python-dist.py
      - python scripts/python-tool.py python -m pytest python/tests

  python:package:
    desc: Build distributions and verify installation outside the checkout.
    dir: python
    cmds:
      - task: python:install
      - python ../scripts/python-tool.py maturin build --release --locked --sdist --out dist
      - python ../scripts/python-tool.py python ../scripts/check-python-dist.py

  website:reference:
    desc: Extract Python and Rust API references for VitePress.
    cmds:
      - task: website:install
      - task: python:build
      - cargo fetch --locked
      - pnpm --dir docs reference

  release:check:
    desc: Validate Versionary configuration and coordinated release plans.
    cmds:
      - npx --yes versionary@1.6.1 verify
      - npx --yes --package versionary@1.6.1 node scripts/check-releases.mjs

  website:install:
    desc: Install locked website dependencies.
    dir: docs
    cmds:
      - pnpm install --frozen-lockfile

  website:dev:
    desc: Serve the website locally with live reload.
    deps: [website:install, python:build]
    dir: docs
    cmds:
      - pnpm dev

  website:check:
    desc: Check formatting, build the website, and validate Worker packaging.
    deps: [website:install, python:build]
    dir: docs
    cmds:
      - pnpm format:check
      - pnpm build
      - pnpm test
      - pnpm deploy:check

  website:deploy:
    desc: Deploy the website to Cloudflare Workers.
    deps: [python:build]
    dir: docs
    cmds:
      - pnpm build
      - pnpm run deploy
