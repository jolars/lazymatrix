[package]
name = "consumer_ndarray_v0_16"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.87"

[lib]
path = "../../src/ndarray.rs"

[features]
parallel = ["lazymatrix/parallel"]
blas = ["lazymatrix/ndarray_v0_16-blas"]

[dependencies]
lazymatrix = { path = "../../../..", default-features = false, features = ["ndarray_v0_16"] }
ndarray = { version = "0.16", default-features = false, features = ["std"] }
